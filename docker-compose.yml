version: '3.8'

services:
  control-plane:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telosvm-control-plane
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
