[project]
name = "telosvm"
version = "0.1.0"
description = "AI intent compiler and WebAssembly runtime"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.5.2",
    "wasmtime>=14.0.0"
]

[project.scripts]
telos = "telosvm.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "B", "I", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] # Allow assert in tests

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
